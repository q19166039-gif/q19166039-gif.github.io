locale: "zh-CN"
title: "我的技术博客"
title_separator: "|"
description: "分享家庭网络、AI 工程、量化系统与开发实践的中文技术博客"
baseurl: ""
url: "https://q19166039-gif.github.io"
repository: "q19166039-gif/q19166039-gif.github.io"
repository_branch: "main"
github_username: q19166039-gif

# Search and navigation
search: true
search_full_content: true
breadcrumbs: true

# SEO and social sharing
og_image: "https://avatars.githubusercontent.com/u/244852751?v=4"
og_image_alt: "q19166039-gif 的 GitHub 头像"
social:
  type: Person
  name: "q19166039-gif"
  links:
    - "https://github.com/q19166039-gif"

include:
  - _pages

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

remote_theme: mmistakes/minimal-mistakes@4.28.0
minimal_mistakes_skin: "dark"

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: true

author:
  name: "q19166039-gif"
  bio: "编程爱好者 | 技术笔记分享"
  links:
    - label: GitHub
      icon: "fab fa-github"
      url: "https://github.com/q19166039-gif"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache

paginate: 5
paginate_path: "/page:num/"

# Simplify permalinks to remove categories from URL
permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: false
      share: true
      related: true
